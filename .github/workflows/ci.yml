name: CI

on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    check:
        # 跑双平台：原生壳只有 macOS 构建，而通道层（daemon 用 unix socket / 命名管道、
        # 终端探测、壳定位）到处都在读 process.platform。单平台 CI 放过的是
        # 「只在作者机器上绿」的用例 —— 首次 CI 就是这样红的。
        # windows-latest 还没进来：那边 daemon 走命名管道，从没在 CI 上验过，
        # 想加就得当成一件独立的事做，不要顺手塞进来把发布卡住。
        name: Typecheck / Build / Test (${{ matrix.os }})
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, macos-latest]
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: 'npm'

            - run: npm ci

            - name: Typecheck
              run: npm run typecheck

            # 必须先 build：MCP 包的用例 import 的是 `harness-gui` 包名
            # （→ core 的 dist），不是 ../src。见 packages/mcp/test/tools.test.ts 顶部注释。
            - name: Build
              run: npm run build

            - name: Test
              run: npm test

            # 发布前的最后一道机械检查：tarball 里必须有 README 和 LICENSE。
            # npm 只认包目录里的那两个文件，不会去上级目录找 —— 漏了就是
            # npm 页面一片空白，而且没有任何报错。
            - name: Verify package contents
              shell: bash
              run: |
                  for p in packages/*/ shells/*/; do
                      [ -f "$p/package.json" ] || continue
                      node -p "require('./$p/package.json').private === true" | grep -q true && continue
                      out=$(cd "$p" && npm pack --dry-run 2>&1)
                      for f in README.md LICENSE; do
                          echo "$out" | grep -q "$f" || { echo "::error::$p 的 tarball 里缺 $f"; exit 1; }
                      done
                      echo "  ✓ $p"
                  done
