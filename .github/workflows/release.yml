name: Release

# changesets 驱动的发布流程。
#
# 每次推到 main，这个 workflow 二选一：
#   (a) 有待处理的 changeset → 开/更新一个 "version packages" PR。合它才会真的改版本号。
#   (b) 没有待处理的 changeset（= 那个 PR 刚被合）→ 把有新版本的包发到 npm。
#
# 怎么发一个改动：
#   1. 在你的 PR 里跑 `npm run changeset`，声明哪些包变了、什么语义级别，
#      把生成的 .changeset/<name>.md 一起提交
#   2. 合进 main
#   3. 机器人开 "version packages" PR，读完 diff 合它
#   4. 合并触发本 workflow 的发布分支
#
# 手工发布（不推荐，会绕过 changelog）：本地 `npm run release`，需要 NPM_TOKEN。

on:
    push:
        branches: [main]

permissions:
    contents: write
    pull-requests: write
    id-token: write        # OIDC trusted publishing 需要

concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

jobs:
    # 先出壳产物。壳只在真要发布时才用得上，所以它不挂在每次 push 的 CI 上；
    # 这里用 workflow_call 复用同一份配方（.github/workflows/shells.yml），
    # 免得两处各写一遍 zig 版本和校验和。
    #
    # 它**总是**跑，哪怕这次只是开 version PR —— 判断「是不是发布模式」要等
    # changesets/action 跑完，那时再构建就多一次串行等待；而壳构建失败时
    # 我们本来也不该发布。
    shells:
        uses: ./.github/workflows/shells.yml

    release:
        name: Version PR / Publish
        needs: shells
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: 'npm'
                  registry-url: 'https://registry.npmjs.org'

            # npm ≥ 11.5 才会在 env 里没有 token 时正确协商 trusted publishing。
            # 钉在 npm 11 线上而不是 @latest：npm 12 对 Node 的下限要求更高
            # （^22.22.2 || ^24.15.0 || >=26），跟着 @latest 走随时会 EBADENGINE。
            - name: Upgrade npm for OIDC trusted publishing
              run: npm install -g npm@11 && npm --version

            - run: npm ci

            - name: Verify dependency signatures
              run: npm audit signatures || echo "::warning::audit signatures reported issues"

            - name: Typecheck
              run: npm run typecheck

            - name: Build
              run: npm run build

            - name: Test
              run: npm test

            # artifact 里是 .app 的**内容**（upload-artifact 会把 path 指向的目录
            # 展平），所以要落进一个名叫 Interact.app 的目录里 ——
            # shells/*/package.json 的 files 就写着这个名字。
            - name: Collect native shells
              uses: actions/download-artifact@v4
              with:
                  pattern: shell-*
                  path: /tmp/shells

            - name: Place shells
              run: |
                  set -euo pipefail
                  shopt -s nullglob
                  for a in /tmp/shells/shell-*; do
                      t="${a##*/shell-}"
                      test -d "shells/$t" || { echo "::warning::没有 shells/$t 这个包，跳过"; continue; }
                      case "$t" in
                        win32-*) dest="shells/$t/Interact.exe" ;;
                        *)       dest="shells/$t/Interact.app" ;;
                      esac
                      mkdir -p "$dest" && cp -R "$a/." "$dest/"
                      echo "  → $dest"
                  done
                  # 缺产物只在这里提示；真正的拦截在 release-publish.sh 里统一做 ——
                  # npm pack 对不存在的 files 条目是静默跳过的，会发出一个空壳包而无人察觉
                  for d in shells/*/; do
                      ls "$d" | grep -qE 'Interact\.(app|exe)' || echo "::warning::$d 还没有产物"
                  done

            # 这一步开出的 "version packages" PR 是由 GITHUB_TOKEN 创建的，
            # GitHub 的防递归规则会让它上面的 CI 停在 action_required（需人工点一下）。
            # 现在 main 没有必需状态检查，所以不挡合并。一旦加了分支保护，
            # 这个 PR 会永久 BLOCKED —— 那时要么给 bot 分支手动放行，
            # 要么在这里把本 job 已经跑过的 typecheck/build/test 结果镜像到
            # bot 分支 HEAD 的必需 context 上。
            - name: Open Version PR or publish
              uses: changesets/action@v1
              with:
                  version: npm run version-packages
                  publish: npm run release
                  commit: 'chore(release): version packages'
                  title: 'chore(release): version packages'
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
                  NPM_DIST_TAG: latest
